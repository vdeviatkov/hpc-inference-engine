name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, compiler: appleclang, preset: release }
          - { os: macos-15, compiler: appleclang, preset: asan }
          - { os: ubuntu-24.04, compiler: gcc, preset: release }
          - { os: ubuntu-24.04, compiler: clang, preset: release }
          - { os: ubuntu-24.04, compiler: clang, preset: asan }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Select compiler
        run: |
          case "${{ matrix.compiler }}" in
            gcc)   echo "CC=gcc"   >> "$GITHUB_ENV"; echo "CXX=g++"     >> "$GITHUB_ENV" ;;
            clang) echo "CC=clang" >> "$GITHUB_ENV"; echo "CXX=clang++" >> "$GITHUB_ENV" ;;
          esac

      - name: Configure, build, test
        run: cmake --workflow --preset ${{ matrix.preset }}

  lint:
    name: format + clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build clang
          pip install -r requirements-dev.txt

      - name: clang-format
        run: scripts/format.sh --check
        env:
          CLANG_FORMAT: clang-format

      - name: clang-tidy
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --preset tidy
          cmake --build --preset tidy
